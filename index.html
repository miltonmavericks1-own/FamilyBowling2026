<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Bowling Event 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #061a45 0%, #0b367b 100%);
      color: #ffffff;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .poster-box {
      width: 100%;
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      margin-bottom: 24px;
    }

    .poster-box img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 720px;
      object-fit: contain;
      background: #ffffff;
    }

    .form-card {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 28px;
      border-radius: 18px;
      background: rgba(3, 19, 57, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .event-tag {
      display: inline-block;
      padding: 7px 12px;
      margin-bottom: 14px;
      border-radius: 999px;
      background: #e9203b;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.15;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #c9d9f5;
      font-size: 15px;
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #7fa5db;
      border-radius: 10px;
      background: #ffffff;
      color: #10244e;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ffd21f;
      box-shadow: 0 0 0 3px rgba(255, 210, 31, 0.24);
    }

    .hint {
      margin: 7px 0 0;
      color: #b9cdea;
      font-size: 12px;
    }

    .submit-button {
      padding: 14px 18px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffd21f, #ff9d10);
      color: #06205a;
      cursor: pointer;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .submit-button:hover {
      filter: brightness(1.06);
    }

    .submit-button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .status {
      min-height: 20px;
      margin: 0;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }

    .status.success {
      color: #7cf3aa;
    }

    .status.error {
      color: #ff9ea8;
    }

    .footer {
      margin: 20px 0 0;
      color: #abc1e3;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 12px 12px 28px;
      }

      .poster-box {
        border-radius: 12px;
        margin-bottom: 16px;
      }

      .form-card {
        padding: 22px 18px;
        border-radius: 14px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="poster-box">
      <img
        src="assets/bowling-poster.png"
        alt="Family Bowling Event 2026 poster"
      />
    </section>

    <section class="form-card">
      <div class="event-tag">Family Bowling 2026</div>

      <h1>Reserve Your Tickets</h1>

      <p class="subtitle">
        Enter your details and the number of tickets required for the Family Bowling Event.
      </p>

      <form
        id="bowling-form"
        action="https://script.google.com/macros/s/AKfycbxd_HN09vs7wWtaVdU9seMBlcq_MAK_5QjToU5u14tSrY5L-v65xtm33g15WjeEEn4a/exec"
        method="POST"
        target="submission-frame"
      >
        <div>
          <label for="firstName">First Name *</label>
          <input
            id="firstName"
            name="firstName"
            type="text"
            placeholder="Enter your first name"
            autocomplete="given-name"
            required
          />
        </div>

        <div>
          <label for="lastName">Last Name *</label>
          <input
            id="lastName"
            name="lastName"
            type="text"
            placeholder="Enter your last name"
            autocomplete="family-name"
            required
          />
        </div>

        <div>
          <label for="ticketsRequired">Number of Tickets Required *</label>
          <input
            id="ticketsRequired"
            name="ticketsRequired"
            type="number"
            min="1"
            step="1"
            placeholder="Example: 4"
            required
          />
          <p class="hint">Enter a whole number of at least 1 ticket.</p>
        </div>

        <button id="submitButton" class="submit-button" type="submit">
          Submit Ticket Request
        </button>

        <p id="status" class="status" aria-live="polite"></p>
      </form>

      <iframe
        id="submission-frame"
        name="submission-frame"
        title="Registration submission"
        style="display: none;"
      ></iframe>

      <p class="footer">
        Registration details are recorded securely for event planning.
      </p>
    </section>
  </main>

  <script>
    const form = document.getElementById("bowling-form");
    const status = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", function (event) {
      const tickets = Number(
        document.getElementById("ticketsRequired").value
      );

      if (!Number.isInteger(tickets) || tickets < 1) {
        event.preventDefault();
        status.textContent = "Please enter at least 1 whole ticket.";
        status.className = "status error";
        return;
      }

      status.textContent = "Submitting your ticket request...";
      status.className = "status";
      submitButton.disabled = true;

      window.setTimeout(function () {
        status.textContent =
          "Thank you! Your ticket request has been submitted.";
        status.className = "status success";
        form.reset();
        submitButton.disabled = false;
      }, 1000);
    });
  </script>
</body>
</html>
