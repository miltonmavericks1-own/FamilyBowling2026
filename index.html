<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Bowling Event 2026 - Ticket Registration</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: #071a43;
      color: #ffffff;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: stretch;
    }

    .image-panel {
      flex: 1 1 auto;
      min-height: 100vh;
      background: #f8fbff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-panel img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    .form-panel {
      width: min(440px, 100%);
      padding: 34px 30px;
      background:
        radial-gradient(circle at top right, rgba(38, 137, 255, 0.28), transparent 35%),
        linear-gradient(160deg, #06143a, #0a2761);
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: -14px 0 35px rgba(0, 0, 0, 0.28);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #dcecff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ffd31a;
      box-shadow: 0 0 14px rgba(255, 211, 26, 0.9);
    }

    h1 {
      font-size: clamp(26px, 3vw, 34px);
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #c9d9f5;
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 24px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #f4f8ff;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid rgba(180, 211, 255, 0.48);
      border-radius: 10px;
      background: rgba(1, 13, 38, 0.56);
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ffd31a;
      box-shadow: 0 0 0 3px rgba(255, 211, 26, 0.2);
    }

    input::placeholder {
      color: #99afd2;
    }

    .hint {
      margin-top: 6px;
      color: #aac0e0;
      font-size: 11px;
      line-height: 1.4;
    }

    .submit-btn {
      margin-top: 4px;
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      cursor: pointer;
      color: #08204d;
      background: linear-gradient(135deg, #ffd31a, #ff9f1a);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.32);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .submit-btn:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
    }

    .status {
      min-height: 20px;
      margin-top: 2px;
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
    }

    .status.success {
      color: #75f0ad;
    }

    .status.error {
      color: #ff9ca8;
    }

    .footer {
      margin-top: 18px;
      color: #a9bedf;
      font-size: 11px;
      line-height: 1.45;
      text-align: center;
    }

    @media (max-width: 800px) {
      .page {
        flex-direction: column;
      }

      .image-panel {
        min-height: auto;
      }

      .image-panel img {
        width: 100%;
        height: auto;
        max-height: 360px;
        object-fit: contain;
      }

      .form-panel {
        width: 100%;
        padding: 26px 20px 30px;
        box-shadow: 0 -12px 30px rgba(0, 0, 0, 0.22);
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="image-panel" aria-label="Family Bowling Event poster">
      <img
        src="Family-Bowling-Night-Adventure.PNG"
        alt="Family Bowling Event 2026 poster"
      />
    </section>

    <section class="form-panel">
      <div class="badge">
        <span class="badge-dot"></span>
        Family Bowling 2026
      </div>

      <h1>Reserve Your Tickets</h1>

      <p class="subtitle">
        Please share your details and the number of tickets required for the Family Bowling Event.
      </p>

      <form id="bowling-form">
        <div>
          <label for="firstName">First Name *</label>
          <input
            id="firstName"
            name="firstName"
            type="text"
            autocomplete="given-name"
            placeholder="Enter your first name"
            required
          />
        </div>

        <div>
          <label for="lastName">Last Name *</label>
          <input
            id="lastName"
            name="lastName"
            type="text"
            autocomplete="family-name"
            placeholder="Enter your last name"
            required
          />
        </div>

        <div>
          <label for="ticketsRequired">Number of Tickets Required *</label>
          <input
            id="ticketsRequired"
            name="ticketsRequired"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            placeholder="Example: 4"
            required
          />
          <p class="hint">Please enter a whole number of at least 1 ticket.</p>
        </div>

        <button id="submitButton" class="submit-btn" type="submit">
          Submit Ticket Request
        </button>

        <div id="status" class="status" aria-live="polite"></div>
      </form>

      <p class="footer">
        Registration details are recorded securely for event planning.
      </p>
    </section>
  </main>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyND3u0dMfOcoT0wPWHTbnbwzlh16DlTGJ86FY8p3vL0DTP1MFc5M7dZqWwIIuEBeRC/exec';
    const form = document.getElementById('bowling-form');
    const statusDiv = document.getElementById('status');
    const submitButton = document.getElementById('submitButton');

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      const ticketCount = Number(
        document.getElementById('ticketsRequired').value
      );

      if (!Number.isInteger(ticketCount) || ticketCount < 1) {
        statusDiv.textContent = 'Please enter at least 1 whole ticket.';
        statusDiv.className = 'status error';
        return;
      }

      if (scriptURL.includes('PASTE_YOUR')) {
        statusDiv.textContent =
          'Setup incomplete: add your Google Apps Script /exec URL in index.html.';
        statusDiv.className = 'status error';
        return;
      }

      statusDiv.textContent = 'Submitting your ticket request...';
      statusDiv.className = 'status';
      submitButton.disabled = true;

      try {
        const response = await fetch(scriptURL, {
          method: 'POST',
          body: new FormData(form)
        });

        const data = await response.json();

        if (data.result === 'success') {
          statusDiv.textContent =
            'Thank you! Your ticket request has been recorded.';
          statusDiv.className = 'status success';
          form.reset();
        } else {
          console.error('Apps Script error:', data);
          statusDiv.textContent =
            'We could not save the request. Please try again.';
          statusDiv.className = 'status error';
        }
      } catch (error) {
        console.error('Submission error:', error);
        statusDiv.textContent =
          'Unable to connect to the registration sheet. Please try again.';
        statusDiv.className = 'status error';
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
